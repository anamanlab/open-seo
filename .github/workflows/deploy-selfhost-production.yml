name: Deploy OpenSEO (production)

# The old Alchemy deployment cannot preserve this installation's inherited
# secrets. Leave a fail-closed dispatch entry so nobody mistakes it for a safe
# production pipeline. The supported Wrangler procedure is in the runbook.
on:
  workflow_dispatch:

permissions: {}

jobs:
  legacy-deployment-disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Refuse unsafe legacy deployment
        run: |
          echo "::error::Legacy Alchemy production deployments are disabled in this fork."
          echo "Use the secret-inheriting Wrangler procedure in docs/maintainers/existing-selfhost-upgrade.md."
          exit 1
