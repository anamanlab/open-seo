name: Deploy OpenSEO (production)

# One controlled deployment entry point. All machines push code; only this
# manually dispatched workflow applies production configuration to Cloudflare.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-seo-selfhost-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'anamanlab/open-seo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Load single canonical production configuration
        env:
          ENV_SELFHOST: ${{ secrets.ENV_SELFHOST }}
        run: |
          set -euo pipefail
          if [ -z "${ENV_SELFHOST:-}" ] || [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Missing ENV_SELFHOST, CLOUDFLARE_API_TOKEN, or CLOUDFLARE_ACCOUNT_ID. Deployment refused."
            exit 1
          fi
          umask 077
          printf '%s\n' "$ENV_SELFHOST" > .env.selfhost
          unset ENV_SELFHOST

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Preflight must pass before any infrastructure mutation
        run: node scripts/selfhost-deploy-preflight.mjs

      - name: Deploy same self-hosted Cloudflare resources
        run: pnpm deploy:selfhost --yes

      - name: Remove local deployment environment file
        if: always()
        run: rm -f .env.selfhost
